; LOT·01 firmware — PlatformIO project
; NOTE: library versions are pinned from memory — verify each on first `pio pkg install` and update.
; P1 target: ESP32-S3-DevKitC-1 (N8R2) wired to breakout boards.
; EVT target: custom board with ESP32-S3FH4R2 (4 MB flash, 2 MB PSRAM).

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  adafruit/Adafruit SHARP Memory Display@1.1.3
  adafruit/Adafruit GFX Library@1.11.11
  boschsensortec/BSEC2 Software Library@1.8.2610
  stm32duino/STM32duino LSM6DSOX@2.3.1
  sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@1.0.4
build_flags =
  -DCORE_DEBUG_LEVEL=2
  -DBOARD_HAS_PSRAM

[env:lot01-p1]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DLOT_HW_P1=1

[env:lot01]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = partitions_ota.csv
build_flags = ${env.build_flags} -DLOT_HW_EVT=1

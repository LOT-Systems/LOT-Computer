; LOT-HW-01 "TILE" firmware — PlatformIO
; Bench target: Seeed XIAO ESP32-S3 (prototype kit, doc 02 §G)
; Product target: custom ESP32-S3-PICO-1 board (add env when the PCB exists)

[env:xiao_bench]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags =
  -DLOT_BENCH=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  adafruit/Adafruit SHARP Memory Display@1.1.3
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit BME680 Library@2.0.5

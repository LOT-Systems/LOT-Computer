; LOT Pager L-01 firmware — PlatformIO (Arduino core on ESP-IDF)
; P1 breadboard target: ESP32-S3-DevKitC-1 N8R8. Custom board file added at EVT.

[env:l01-devkit]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
  -DL01_FW_VERSION=\"0.1.0\"
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=2
lib_deps =
  adafruit/Adafruit SHARP Memory Display
  adafruit/Adafruit GFX Library
  boschsensortec/BSEC2 Software Library
  bblanchon/ArduinoJson@^7

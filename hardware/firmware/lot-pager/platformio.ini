; LOT Pager firmware v0.1 — EVT bring-up on an ESP32-S3 devkit.
; NOT YET COMPILED IN CI (no PlatformIO toolchain in the session). Build: pio run -e evt
[env:evt]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -DLOT_FW_VERSION=\"0.1.0\" -DCORE_DEBUG_LEVEL=1
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  zinggjm/GxEPD2@1.6.1
  adafruit/Adafruit BME280 Library@2.2.4

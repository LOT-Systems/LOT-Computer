; LOT TILE (LOT-HW-01) firmware — PlatformIO project
; Build:  pio run -e devkit      Flash: pio run -e devkit -t upload

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DLOT_FW_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=3
board_build.partitions = default_8MB.csv
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  adafruit/Adafruit SHARP Memory Display@^1.1.3
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit DRV2605 Library@^1.2.4
  espressif/esp32-camera@^2.0.4

; Development: ESP32-S3-DevKitC-1-N8R8 + breakout boards (EVT-0)
[env:devkit]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DLOT_HW_REV=\"DEVKIT\" -DBOARD_HAS_PSRAM

; EVT1 custom PCB: ESP32-S3-MINI-1-N4R2 (4 MB flash, 2 MB quad PSRAM)
[env:evt1]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = min_spiffs.csv
build_flags = ${env.build_flags} -DLOT_HW_REV=\"EVT1\" -DBOARD_HAS_PSRAM

; LOT PAGER · TILE-40 · firmware v0.1 (EVT-0, dev-kit target)
; Target for EVT-0: Seeed XIAO ESP32S3 Sense (ESP32-S3 + OV2640 + 8MB PSRAM)
; Target for EVT-1+: custom PCB, ESP32-S3FH4R2 chip-down (see docs/hardware/lot-pager/04-PCB-PCBWAY.md)

[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DLOT_FW_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  adafruit/Adafruit SHARP Memory Display
  adafruit/Adafruit GFX Library
  bblanchon/ArduinoJson @ ^7
  boschsensortec/BME68x Sensor library

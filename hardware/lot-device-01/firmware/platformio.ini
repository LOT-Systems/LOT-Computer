; LOT-DEVICE-01 "Pager" firmware — PlatformIO project
; Stage A dev kit: Seeed XIAO ESP32S3 Sense + Sharp Memory LCD + BME688 (see docs/hardware/LOT-DEVICE-01-BOM.md)

[platformio]
default_envs = devkit

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DLOT_FW_VERSION=\"0.1.0\"
lib_deps =
  bblanchon/ArduinoJson@^7
  adafruit/Adafruit SHARP Memory Display@^1.1
  adafruit/Adafruit GFX Library@^1.11
  adafruit/Adafruit BME680 Library@^2.0
  h2zero/NimBLE-Arduino@^1.4

[env:devkit]
board = seeed_xiao_esp32s3
build_flags = ${env.build_flags} -DLOT_BOARD_DEVKIT=1

[env:evt]
; Custom PCB (ESP32-S3FH4R2). Pin map in include/board_evt.h
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DLOT_BOARD_EVT=1

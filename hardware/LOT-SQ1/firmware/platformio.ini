; LOT SQ-1 firmware — PlatformIO project
; EVT-1 target: ESP32-S3 (S3R8 chip-down or ESP32-S3-MINI-1-N8R8 module)
; P1 breadboard: use env:sq1-devkit with an ESP32-S3-DevKitC-1 N8R8

[platformio]
default_envs = sq1-devkit

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.partitions = default_8MB.csv
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  zinggjm/GxEPD2 @ ^1.5.9
  bblanchon/ArduinoJson @ ^7.0.4
  espressif/esp32-camera @ ^2.0.4
  boschsensortec/BME68x Sensor library @ ^1.1.40407
  sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library @ ^1.0.4

[env:sq1-devkit]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi

[env:sq1-evt1]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DSQ1_EVT1=1

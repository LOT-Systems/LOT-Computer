; LOT PAGER — firmware build (HW-01)
; Target: ESP32-S3FH4R2 (4 MB in-package flash, 2 MB in-package PSRAM)
; Rev A EVT boards use ESP32-S3-MINI-1-N4R2 (same silicon, pre-certified module).

[platformio]
default_envs = lot-pager-reva

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DLOT_FW_VERSION=\"0.1.0\"
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit SHARP Memory Display@1.1.3
  adafruit/Adafruit BME680 Library@2.0.5
  bblanchon/ArduinoJson@7.2.1

; EVT bring-up on an off-the-shelf ESP32-S3 devkit + breakout boards
[env:lot-pager-devkit]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DLOT_BOARD_DEVKIT=1

; Custom LOT PCB (PCBWay), Rev A
[env:lot-pager-reva]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags = ${env.build_flags} -DLOT_BOARD_REVA=1
